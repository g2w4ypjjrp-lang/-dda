# futbol.canarslan.net.tr → futbol uygulaması (127.0.0.1:3080). YALNIZCA bu alt alan adı için;
# sunucudaki diğer siteler bu dosyadan etkilenmez. Kurulum: docs/vds-kurulum.md §4.
#   sudo cp deploy/vds/nginx/futbol.canarslan.net.tr.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/futbol.canarslan.net.tr.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d futbol.canarslan.net.tr      # HTTPS (bu dosyaya 443 bloğunu ekler)
server {
    listen 80;
    # Diğer sitelerinizde "listen [::]:80;" varsa (sunucuda IPv6 açıksa) aşağıdaki satırı açın.
    # listen [::]:80;
    server_name futbol.canarslan.net.tr;

    client_max_body_size 1m;

    # İç izleme ucu dışarı açılmaz.
    location = /metrics { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Gerçek istemci IP'si: gelen sahte X-Forwarded-For EZİLİR (ekleme yapılmaz).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
