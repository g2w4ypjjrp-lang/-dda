# futbol.canarslan.net.tr → futbol uygulaması (127.0.0.1:3080). YALNIZCA bu alt alan adı için.
# Gerekli modüller: sudo a2enmod proxy proxy_http headers
#   sudo cp deploy/vds/apache/futbol.canarslan.net.tr.conf /etc/apache2/sites-available/
#   sudo a2ensite futbol.canarslan.net.tr && sudo apachectl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d futbol.canarslan.net.tr
<VirtualHost *:80>
    ServerName futbol.canarslan.net.tr

    LimitRequestBody 1048576
    ProxyPreserveHost On
    ProxyRequests Off

    # İç izleme ucu dışarı açılmaz.
    <Location "/metrics">
        Require all denied
    </Location>

    # Gerçek istemci IP'si: gelen sahte X-Forwarded-For ezilir.
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
    ProxyAddHeaders Off

    ProxyPass        / http://127.0.0.1:3080/
    ProxyPassReverse / http://127.0.0.1:3080/
</VirtualHost>
