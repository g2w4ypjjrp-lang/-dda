# Örnek Prometheus yapılandırması: API'nin /metrics ucunu iç ağdan jetonla okur.
# Jeton dosyası: MI_METRICS_TOKEN ile aynı değer (dosya izni 0400).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: match-intelligence-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/mi_metrics_token
    static_configs:
      - targets: ["api:8080"]
