name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (PostgreSQL 16 + Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mi_test
          POSTGRES_PASSWORD: mi_test
          POSTGRES_DB: mi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 20
    env:
      MI_TEST_DATABASE_URL: postgresql://mi_test:mi_test@127.0.0.1:5432/mi_test
      MI_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  docker:
    name: API imajı derlemesi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mi-api:ci api
      - run: docker compose config --quiet
        env:
          MI_DB_PASSWORD: ci
          MI_SECRET_KEK: Y2ljaWNpY2ljaWNpY2ljaWNpY2ljaWNpY2ljaWNpY2k=

  audit:
    name: Bağımlılık açığı taraması
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv export --locked --no-dev --no-hashes --no-emit-project -o requirements.txt
      - run: uvx pip-audit -r requirements.txt --strict
