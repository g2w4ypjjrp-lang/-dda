name: CI

# Actions dakikalarını korumak için: yalnızca ana dala gönderimde, PR'larda ve elle.
on:
  push:
    branches: [ana]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (PostgreSQL 16 + Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mi_test
          POSTGRES_PASSWORD: mi_test
          POSTGRES_DB: mi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 20
    env:
      MI_TEST_DATABASE_URL: postgresql://mi_test:mi_test@127.0.0.1:5432/mi_test
      MI_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  ml:
    name: ML (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mi_test
          POSTGRES_PASSWORD: mi_test
          POSTGRES_DB: mi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MI_TEST_DATABASE_URL: postgresql://mi_test:mi_test@127.0.0.1:5432/mi_test
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    name: Web (derleme + uçtan uca, tam yığın)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mi_test
          POSTGRES_PASSWORD: mi_test
          POSTGRES_DB: mi_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      MI_ENVIRONMENT: test
      MI_DATABASE_URL: postgresql://mi_test:mi_test@127.0.0.1:5432/mi_e2e
      MI_REDIS_URL: redis://127.0.0.1:6379/0
      MI_SECRET_KEK: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
      MI_SESSION_COOKIE_SECURE: "false"
      MI_LOG_JSON: "false"
      MI_PAYMENT_PROVIDER: simulator
      MI_LICENSE_PEPPER: cGVwcGVycGVwcGVycGVwcGVycGVwcGVycGVwcGVycGU=
      MI_API_URL: http://127.0.0.1:8080
      E2E_API_DIR: ${{ github.workspace }}/api
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: API ve demo verisi (yalnızca test ortamı)
        run: |
          (cd api && uv sync --locked && uv run mi-admin migrate)
          (cd ml && uv sync --locked && uv run python scripts/seed_demo.py)
          (cd api && nohup uv run mi-api --port 8080 > /tmp/api.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/ready && break; sleep 1; done
      - name: Web derleme
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          npm audit --omit=dev --audit-level=moderate
      - name: Uçtan uca testler (masaüstü + mobil)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          (nohup npx next start -p 3000 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/ > /dev/null && break; sleep 1; done
          npx playwright test --trace off
      - if: failure()
        run: tail -n 100 /tmp/api.log /tmp/web.log || true

  docker:
    name: API, ML ve web imajı derlemesi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mi-api:ci api
      - run: docker build -f ml/Dockerfile -t mi-ml:ci .
      - run: docker build -t mi-web:ci web
      - run: docker compose config --quiet
        env:
          MI_DB_PASSWORD: ci
          MI_SECRET_KEK: Y2ljaWNpY2ljaWNpY2ljaWNpY2ljaWNpY2ljaWNpY2k=
      - name: Üretim yığını yapılandırması (docker-compose.prod.yml, tüm profiller)
        run: |
          cp .env.prod.example .env.prod
          docker compose -f docker-compose.prod.yml --env-file .env.prod --profile ml --profile monitoring config --quiet
        env:
          MI_DOMAIN: ci.invalid
          MI_ACME_EMAIL: ci@ci.invalid
      - name: Caddyfile doğrulama
        run: >
          docker run --rm -e MI_DOMAIN=ci.invalid -e MI_ACME_EMAIL=ci@ci.invalid
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Prometheus uyarı kuralları
        run: >
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/p:ro"
          prom/prometheus:v3.5.0 check rules /p/alerts.yml

  audit:
    name: Bağımlılık açığı taraması
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv export --locked --no-dev --no-hashes --no-emit-project -o requirements.txt
      - run: uvx pip-audit -r requirements.txt --strict
      - name: ML bağımlılıkları
        working-directory: ml
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project --no-emit-package mi-api -o requirements.txt
          uvx pip-audit -r requirements.txt --strict
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web üretim bağımlılıkları (geliştirme araçları hariç; bkz. docs/13-faz10-raporu.md)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
